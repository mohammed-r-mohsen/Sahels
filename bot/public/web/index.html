<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساهل | بوابة العيادة الذكية 2030</title>
    
    <!-- الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --saudi: #0A5C36; 
            --gold: #C5A059; 
            --dark: #030706; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Almarai', sans-serif; }
        body { background-color: var(--dark); color: white; overflow-x: hidden; }

        /* حاوية WebGL */
        #canvas-container { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 0; 
        }

        /* طبقة واجهة المستخدم (UI) */
        #ui-layer {
            position: relative; 
            z-index: 10; 
            pointer-events: none; /* السماح بمرور الأحداث إلى WebGL */
        }
        #ui-layer > * { pointer-events: auto; }

        /* شاشة البداية (تختفي عند التمرير) */
        .hero-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background: linear-gradient(to bottom, rgba(3,7,6,0.8) 0%, rgba(3,7,6,0) 100%);
        }
        .hero-section h1 {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        .hero-section h1 span { color: var(--gold); }
        .hero-section p {
            font-size: 1.4rem;
            color: #ccc;
            max-width: 600px;
            margin-bottom: 40px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.9);
        }
        .btn-scroll {
            padding: 15px 40px;
            background: var(--saudi);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(10, 92, 54, 0.6);
        }
        .btn-scroll:hover {
            background: #0d7a48;
            box-shadow: 0 0 50px rgba(10, 92, 54, 0.9);
            transform: scale(1.05);
        }

        /* مساحة التمرير لتحريك الكاميرا */
        .scroll-space {
            height: 300vh; /* مساحة كافية لتحريك الكاميرا */
        }

        /* نافذة التسجيل (تظهر عند فتح الباب) */
        #registration-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%;
            max-width: 500px;
            background: rgba(10, 20, 15, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--gold);
            border-radius: 20px;
            padding: 40px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #registration-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }
        #registration-modal h2 {
            color: var(--gold);
            text-align: center;
            margin-bottom: 20px;
            font-size: 2rem;
        }
        #registration-modal input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
        }
        #registration-modal input:focus {
            outline: none;
            border-color: var(--gold);
        }
        #registration-modal button {
            width: 100%;
            padding: 15px;
            background: var(--saudi);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        #registration-modal button:hover {
            background: #0d7a48;
        }
        .close-modal {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #aaa;
            cursor: pointer;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <!-- مشهد Three.js -->
    <div id="canvas-container"></div>

    <!-- واجهة المستخدم -->
    <div id="ui-layer">
        <!-- قسم الترحيب -->
        <section class="hero-section">
            <h1>بوابة <span>ساهل</span> الرقمية</h1>
            <p>مرحباً بك في مستقبل إدارة العيادات. مرر للأسفل للاقتراب من المدخل.</p>
            <button class="btn-scroll" onclick="window.scrollTo({top: window.innerHeight, behavior: 'smooth'})">ابدأ الجولة</button>
        </section>

        <!-- مساحة التمرير -->
        <div class="scroll-space"></div>
    </div>

    <!-- نافذة التسجيل -->
    <div id="registration-modal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h2>سجل عيادتك الآن</h2>
        <form onsubmit="event.preventDefault(); alert('تم التسجيل بنجاح!'); closeModal();">
            <input type="text" placeholder="اسم العيادة" required>
            <input type="text" placeholder="اسم المسؤول" required>
            <input type="tel" placeholder="رقم الجوال (05xxxxxxxx)" required pattern="05[0-9]{8}">
            <button type="submit">انضم إلى ساهل</button>
        </form>
    </div>

    <!-- المكتبات -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>
    <script src="https://unpkg.com/troika-three-text@0.49.0/dist/troika-three-text.umd.js"></script>

    <script>
        // 1. إعداد Lenis للتمرير السلس
        const lenis = new Lenis({
            duration: 1.5,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smooth: true,
        });
        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        // 2. إعداد Three.js Scene
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030706, 0.015); // ضباب خفيف للعمق

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 15); // البداية بعيداً عن المبنى

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // 3. الإضاءة
        const ambientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // إضاءة نيون سعودية
        const saudiLight = new THREE.PointLight(0x0A5C36, 2, 20);
        saudiLight.position.set(-5, 3, 5);
        scene.add(saudiLight);

        const goldLight = new THREE.PointLight(0xC5A059, 2, 20);
        goldLight.position.set(5, 3, 5);
        scene.add(goldLight);

        // 4. بناء الأرضية
        const floorGeometry = new THREE.PlaneGeometry(50, 50);
        const floorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x111111, 
            roughness: 0.1, 
            metalness: 0.8 
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // 5. بناء المبنى (العيادة)
        const buildingGroup = new THREE.Group();

        // الجدران
        const wallMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x222222, 
            roughness: 0.5, 
            metalness: 0.5 
        });
        const wallGeometry = new THREE.BoxGeometry(8, 6, 4);
        const building = new THREE.Mesh(wallGeometry, wallMaterial);
        building.position.set(0, 3, 0);
        building.castShadow = true;
        building.receiveShadow = true;
        buildingGroup.add(building);

        // إطار الباب (الذهبي)
        const doorFrameMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xC5A059, 
            emissive: 0xC5A059, 
            emissiveIntensity: 0.5,
            metalness: 1,
            roughness: 0.2
        });
        const doorFrameGeometry = new THREE.BoxGeometry(2.2, 4.2, 0.2);
        const doorFrame = new THREE.Mesh(doorFrameGeometry, doorFrameMaterial);
        doorFrame.position.set(0, 2.1, 2.01);
        buildingGroup.add(doorFrame);

        // الباب الزجاجي (يتحرك)
        const doorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x0A5C36, 
            emissive: 0x0A5C36, 
            emissiveIntensity: 0.3,
            transparent: true, 
            opacity: 0.6,
            metalness: 0.9,
            roughness: 0.1
        });
        const doorGeometry = new THREE.BoxGeometry(2, 4, 0.1);
        const door = new THREE.Mesh(doorGeometry, doorMaterial);
        door.position.set(0, 2, 2.05);
        door.castShadow = true;
        // تعيين نقطة الأصل للدوران من الحافة
        door.geometry.translate(1, 0, 0); 
        door.position.set(-1, 2, 2.05);
        buildingGroup.add(door);

        // نص ثلاثي الأبعاد فوق الباب
        const textGeometry = new THREE.TextGeometry('عيادة ساهل', { // ملاحظة: Three.js TextGeometry يحتاج خطوط، سنستخدم Troika بدلاً منه لاحقاً
            // ...
        });
        // سنستخدم Troika Text
        const troikaText = new Troika.Text();
        troikaText.text = 'عيادة ساهل';
        troikaText.fontSize = 0.8;
        troikaText.color = 0xC5A059;
        troikaText.position.set(0, 5, 2.1);
        troikaText.anchorX = 'center';
        buildingGroup.add(troikaText);

        scene.add(buildingGroup);

        // 6. حركة الكاميرا مع التمرير (GSAP ScrollTrigger)
        gsap.registerPlugin(ScrollTrigger);

        // تحريك الكاميرا للأمام نحو الباب
        gsap.to(camera.position, {
            z: 3.5, // الاقتراب من الباب
            y: 2,   // الارتفاع قليلاً
            scrollTrigger: {
                trigger: ".scroll-space",
                start: "top top",
                end: "bottom bottom",
                scrub: 1, // مزامنة مع التمرير
            }
        });

        // إمالة الكاميرا قليلاً عند الاقتراب
        gsap.to(camera.rotation, {
            x: -0.1,
            scrollTrigger: {
                trigger: ".scroll-space",
                start: "top top",
                end: "bottom bottom",
                scrub: 1,
            }
        });

        // 7. التفاعل مع الباب (النقر)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            // حساب إحداثيات الماوس
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(door);

            if (intersects.length > 0) {
                // فتح الباب
                gsap.to(door.rotation, {
                    y: -Math.PI / 2, // دوران 90 درجة
                    duration: 1.5,
                    ease: "power2.inOut",
                    onComplete: () => {
                        // إظهار نافذة التسجيل
                        document.getElementById('registration-modal').classList.add('active');
                    }
                });
                // تغيير لون الباب إلى الذهبي
                gsap.to(doorMaterial.emissive, {
                    r: 0.77, g: 0.62, b: 0.35, // لون ذهبي
                    duration: 1
                });
            }
        });

        // إغلاق النافذة وإعادة الباب
        window.closeModal = function() {
            document.getElementById('registration-modal').classList.remove('active');
            gsap.to(door.rotation, {
                y: 0,
                duration: 1.5,
                ease: "power2.inOut"
            });
            gsap.to(doorMaterial.emissive, {
                r: 0.04, g: 0.36, b: 0.21, // العودة للأخضر
                duration: 1
            });
        };

        // 8. حلقة الرسم
        function animate() {
            requestAnimationFrame(animate);
            
            // إضاءة نيون متحركة
            const time = Date.now() * 0.001;
            saudiLight.intensity = 1.5 + Math.sin(time * 2) * 0.5;
            goldLight.intensity = 1.5 + Math.cos(time * 2) * 0.5;

            renderer.render(scene, camera);
        }
        animate();

        // 9. التعامل مع تغيير الحجم
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
