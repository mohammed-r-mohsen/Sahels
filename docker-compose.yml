services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sahels
      POSTGRES_USER: sahels
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Riyadh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahels"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: ./bot
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://sahels:${POSTGRES_PASSWORD}@postgres:5432/sahels
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      TZ: Asia/Riyadh
    ports: ["3000:3000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: ${BOT_MEM_LIMIT:-1G}

  central:
    build: ./central
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://sahels:${POSTGRES_PASSWORD}@postgres:5432/sahels
      TZ: Asia/Riyadh
    ports: ["4000:4000"]

  agent:
    build: ./agent
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://sahels:${POSTGRES_PASSWORD}@postgres:5432/sahels
      TZ: Asia/Riyadh

  nocodb:
    image: nocodb/nocodb:latest
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NC_DB: pg://postgres:5432?u=sahels&p=${POSTGRES_PASSWORD}&d=sahels
    ports: ["8080:8080"]
    volumes:
      - nocodbdata:/usr/app/data

volumes:
  pgdata:
  redisdata:
  nocodbdata: