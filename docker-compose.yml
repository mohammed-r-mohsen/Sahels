services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sahels
      POSTGRES_USER: sahels
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sahels_dev_pass}
      TZ: Asia/Riyadh
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahels"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-sahels_redis} --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sahels_redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://sahels:${POSTGRES_PASSWORD:-sahels_dev_pass}@postgres:5432/sahels
      REDIS_URL: redis://:${REDIS_PASSWORD:-sahels_redis}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      BIND_ADDR: 0.0.0.0:8080
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-sahel-verify}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v22.0}
      META_REMINDER_TEMPLATE: ${META_REMINDER_TEMPLATE:-sahel_appointment_reminder}
      META_REMINDER_TEMPLATE_LANGUAGE: ${META_REMINDER_TEMPLATE_LANGUAGE:-ar}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      MOYASAR_SECRET_KEY: ${MOYASAR_SECRET_KEY:-}
      BILLING_CALLBACK_URL: ${BILLING_CALLBACK_URL:-}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:-}
      TZ: Asia/Riyadh
      RUST_LOG: sahel_api=info,tower_http=info
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
  redisdata:
